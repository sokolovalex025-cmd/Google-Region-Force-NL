name: Shell validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          bash -n google-region-force.sh
          bash -n install-universal.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          severity: warning
          scandir: .
